[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph"
version = "0.0.35"
description = "A library to store data in a knowledge graph"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Hyro AI", email = "contact@hyro.ai" }]
keywords = ["tag1", "tag2"]
dependencies = [
    "dataclasses_json==0.5.7",
    "gamla==164",
    "immutables",
    "phonenumbers",
]

[dependency-groups]
test = [
    "pytest",
    # storage.py imports cloud_utils at runtime, but PyPI rejects direct-URL
    # dependencies, so it cannot be declared above — consumers declare their own
    # cloud-utils pin and tests get it here.
    "cloud-utils @ git+https://github.com/hyroai/cloud-utils.git@33725609b55bdc4fbe89e1f61cb76affbe729f22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_graph*"]

[tool.isort]
float_to_top = true
atomic = true
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_third_party = [
    "cloud_utils",
    "dataclasses_json",
    "gamla",
    "phonenumbers",
    "pytest",
    "setuptools",
]
